<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invoice &amp; Quotation Request — DR.ORFLI</title>
  <meta name="description" content="Request a formal invoice or quotation from DR.ORFLI for luxury hotel digital marketing services.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#08090C;color:#F5F6F8;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
    .container{max-width:720px;margin:0 auto;padding:0 24px}
    .hero{padding:100px 24px 60px;text-align:center}
    .hero-eyebrow{font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;color:#C9A24B;margin-bottom:16px}
    .hero-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3rem);font-weight:700;color:#F5F6F8;margin-bottom:16px}
    .hero-sub{color:#B6BCC8;font-size:1rem;max-width:540px;margin:0 auto}
    .form-card{background:#0E1016;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:40px;margin:0 0 80px}
    .form-group{margin-bottom:18px}
    label{display:block;font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:#B6BCC8;margin-bottom:6px;font-weight:500}
    input,textarea,select{width:100%;background:#161922;border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#F5F6F8;font-family:'Inter',sans-serif;font-size:0.9rem;padding:12px 14px;outline:none;transition:border-color 0.2s}
    input:focus,textarea:focus,select:focus{border-color:rgba(201,162,75,0.5)}
    textarea{resize:vertical;min-height:120px}
    select option{background:#161922}
    .checkbox-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
    .checkbox-item{display:flex;align-items:center;gap:8px;cursor:pointer}
    .checkbox-item input[type=checkbox]{width:auto;accent-color:#C9A24B;cursor:pointer}
    .checkbox-item span{font-size:0.88rem;color:#F5F6F8}
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
    .btn-wa{background:#25D366;color:#fff;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:700;padding:14px;cursor:pointer;letter-spacing:0.04em;transition:background 0.2s}
    .btn-wa:hover{background:#1ebe5a}
    .btn-email{background:#C9A24B;color:#08090C;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:700;padding:14px;cursor:pointer;letter-spacing:0.04em;transition:background 0.2s}
    .btn-email:hover{background:#E3BE63}
    .divider{height:1px;background:rgba(255,255,255,0.07);margin:24px 0}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:560px){.row2{grid-template-columns:1fr}.btn-row{grid-template-columns:1fr}.checkbox-group{grid-template-columns:1fr}}
  </style>
</head>
<body>

<nav style="position:sticky;top:0;z-index:100;background:rgba(8,9,12,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(201,162,75,0.15);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between">
  <a href="/" style="font-family:'Playfair Display',serif;font-size:1.1rem;color:#F5F6F8;text-decoration:none;display:flex;align-items:center;gap:8px"><span style="color:#C9A24B">◆</span> DR.ORFLI</a>
  <div style="display:flex;gap:16px;align-items:center">
    <a href="/" style="font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;color:#B6BCC8;text-decoration:none">Home</a>
    <a href="/services.html" style="font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;color:#B6BCC8;text-decoration:none">Services</a>
    <a href="/guides/" style="font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;color:#B6BCC8;text-decoration:none">Guides</a>
    <a href="/dr-orfli-media-kit.html" style="font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;color:#B6BCC8;text-decoration:none">Media Kit</a>
    <a href="/contact.html" style="font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;color:#B6BCC8;text-decoration:none">Contact</a>
    <a href="https://wa.me/966570116911?text=Hello%20DR.ORFLI%2C%20I%20want%20to%20request%20a%20quotation." target="_blank" style="background:#C9A24B;color:#08090C;padding:8px 16px;border-radius:6px;font-size:0.8rem;font-weight:700;text-decoration:none;letter-spacing:0.08em">WhatsApp</a>
  </div>
</nav>

<section class="hero">
  <p class="hero-eyebrow">Formal Request</p>
  <h1 class="hero-title">Invoice &amp; Quotation Request</h1>
  <p class="hero-sub">Request a bespoke quotation for your hotel's digital marketing needs. We respond within 24 hours.</p>
</section>

<div class="container">
  <div class="form-card">
    <form id="invoiceForm" action="mailto:info@dr-orfli.com" method="GET" enctype="text/plain">
      <div class="row2">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="Mohammed Al-Rashidi" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="you@hotel.com" required>
        </div>
      </div>
      <div class="form-group">
        <label for="company">Hotel / Company Name *</label>
        <input type="text" id="company" name="company" placeholder="Grand Palace Hotel & Resort" required>
      </div>
      <div class="form-group">
        <label>Services Required</label>
        <div class="checkbox-group" id="servicesGroup">
          <label class="checkbox-item"><input type="checkbox" value="Influencer Marketing"><span>Influencer Marketing</span></label>
          <label class="checkbox-item"><input type="checkbox" value="Luxury Hotel Promotion"><span>Luxury Hotel Promotion</span></label>
          <label class="checkbox-item"><input type="checkbox" value="Reels Production"><span>Reels Production</span></label>
          <label class="checkbox-item"><input type="checkbox" value="Instagram Growth"><span>Instagram Growth</span></label>
          <label class="checkbox-item"><input type="checkbox" value="Luxury Destination Guide"><span>Luxury Destination Guide</span></label>
          <label class="checkbox-item"><input type="checkbox" value="Business Collaboration"><span>Business Collaboration</span></label>
          <label class="checkbox-item"><input type="checkbox" value="Full Campaign Package"><span>Full Campaign Package</span></label>
          <label class="checkbox-item"><input type="checkbox" value="Ongoing Retainer"><span>Ongoing Retainer</span></label>
        </div>
      </div>
      <div class="form-group">
        <label for="currency">Currency Preference</label>
        <select id="currency" name="currency">
          <option value="USD">USD — US Dollar</option>
          <option value="EUR">EUR — Euro</option>
          <option value="GBP">GBP — British Pound</option>
          <option value="SAR">SAR — Saudi Riyal</option>
        </select>
      </div>
      <div class="form-group">
        <label for="scope">Scope &amp; Details *</label>
        <textarea id="scope" name="scope" placeholder="Describe the scope of work, your property, timeline, and any specific requirements..." required></textarea>
      </div>
      <div class="form-group">
        <label for="message">Additional Message</label>
        <textarea id="message" name="message" placeholder="Any other details, questions, or notes..." style="min-height:80px"></textarea>
      </div>
      <div class="divider"></div>
      <div class="btn-row">
        <button type="button" class="btn-wa" onclick="sendInvoiceWhatsApp()">💬 Send via WhatsApp</button>
        <button type="submit" class="btn-email">✉️ Send via Email</button>
      </div>
    </form>
  </div>
</div>

<footer style="background:#08090C;border-top:1px solid rgba(201,162,75,0.15);padding:48px 24px;text-align:center">
  <p style="font-family:'Playfair Display',serif;color:#C9A24B;font-size:1rem;margin:0 0 16px">◆ DR.ORFLI</p>
  <div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-bottom:24px">
    <a href="/" style="color:#B6BCC8;text-decoration:none;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase">Home</a>
    <a href="/services.html" style="color:#B6BCC8;text-decoration:none;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase">Services</a>
    <a href="/guides/" style="color:#B6BCC8;text-decoration:none;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase">Guides</a>
    <a href="/contact.html" style="color:#B6BCC8;text-decoration:none;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase">Contact</a>
    <a href="/privacy-policy.html" style="color:#B6BCC8;text-decoration:none;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase">Privacy</a>
    <a href="/terms-of-service.html" style="color:#B6BCC8;text-decoration:none;font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase">Terms</a>
  </div>
  <p style="color:#B6BCC8;font-size:0.75rem;margin:0">© 2026 DR.ORFLI. All rights reserved.</p>
</footer>

<script>
function sendInvoiceWhatsApp(){
  var n=document.getElementById('name').value||'';
  var e=document.getElementById('email').value||'';
  var co=document.getElementById('company').value||'';
  var cur=document.getElementById('currency').value||'';
  var sc=document.getElementById('scope').value||'';
  var m=document.getElementById('message').value||'';
  var checks=[].slice.call(document.querySelectorAll('#servicesGroup input[type=checkbox]:checked'));
  var svcs=checks.map(function(c){return c.value}).join(', ');
  var msg='Hello DR.ORFLI, I would like to request a quotation.\n\n'
    +'Name: '+n+'\nEmail: '+e+'\nCompany/Hotel: '+co
    +'\nServices Required: '+svcs+'\nCurrency: '+cur
    +'\nScope: '+sc+'\n\n'+m;
  window.open('https://wa.me/966570116911?text='+encodeURIComponent(msg),'_blank');
}
</script>
</body>
</html>
